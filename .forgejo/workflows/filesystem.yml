name: Filesystem

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-contract:
    name: host-contract
    runs-on: pyxis
    timeout-minutes: 5
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-gcc16.2-binutils2.47
      options: >-
        --memory=4g --memory-swap=4g --ulimit core=0:0
        --mount 'type=volume,destination=/run/pyxis-fs-ram,volume-opt=type=tmpfs,volume-opt=device=tmpfs,"volume-opt=o=rw,nosuid,nodev,size=2g,nr_inodes=65536"'
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify RAM boundary, build and test
        run: python3 tests/ram_run.py --inside --suite check --ci-quick
