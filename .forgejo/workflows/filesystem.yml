name: Filesystem

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-contract:
    name: host-contract
    runs-on: pyxis-fs-ram
    timeout-minutes: 5
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-gcc16.2-binutils2.47
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build npfs format library and host tools
        run: make -j16
