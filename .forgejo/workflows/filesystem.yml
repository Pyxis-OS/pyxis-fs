name: Filesystem

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-contract:
    name: host-contract
    runs-on: pyxis-fs-ram
    timeout-minutes: 5
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-gcc16.2-binutils2.47
      options: --memory=4g
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify RAM boundary, build and test
        run: python3 tests/ram_run.py --inside --suite check --ci-quick
